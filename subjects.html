<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Subjects | Study Portal</title>

    <link rel="stylesheet" href="question-papers.css">

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <h1>
        📚 Question Papers
    </h1>

    <p>
        Select your subject
    </p>

</header>



<!-- ================= MAIN ================= -->

<main class="container">


    <!-- BACK -->

    <a href="javascript:history.back()" class="back">
        ← Back to Semester
    </a>



    <!-- TITLE -->

    <div class="page-title">

        <h2 id="pageTitle">
            Select Subject
        </h2>

        <p>
            Choose a subject to view previous year question papers.
        </p>

    </div>



    <!-- ================= SUBJECTS ================= -->

    <div class="semester-grid">


        <!-- SUBJECT 1 -->

        <a href="#" class="semester-card subject-link"
           data-subject="1">

            <div class="semester-number">
                01
            </div>

            <h3>
                Subject 1
            </h3>

        </a>



        <!-- SUBJECT 2 -->

        <a href="#" class="semester-card subject-link"
           data-subject="2">

            <div class="semester-number">
                02
            </div>

            <h3>
                Subject 2
            </h3>

        </a>



        <!-- SUBJECT 3 -->

        <a href="#" class="semester-card subject-link"
           data-subject="3">

            <div class="semester-number">
                03
            </div>

            <h3>
                Subject 3
            </h3>

        </a>



        <!-- SUBJECT 4 -->

        <a href="#" class="semester-card subject-link"
           data-subject="4">

            <div class="semester-number">
                04
            </div>

            <h3>
                Subject 4
            </h3>

        </a>



        <!-- SUBJECT 5 -->

        <a href="#" class="semester-card subject-link"
           data-subject="5">

            <div class="semester-number">
                05
            </div>

            <h3>
                Subject 5
            </h3>

        </a>



        <!-- SUBJECT 6 -->

        <a href="#" class="semester-card subject-link"
           data-subject="6">

            <div class="semester-number">
                06
            </div>

            <h3>
                Subject 6
            </h3>

        </a>


    </div>


</main>



<!-- ================= FOOTER ================= -->

<footer class="footer">

    <p>
        © 2026 Study Portal | Ajay Chauhan
    </p>

</footer>



<!-- ================= JAVASCRIPT ================= -->

<script>

    /*
    ==========================================
    URL SE COURSE AUR SEMESTER LENA
    ==========================================
    */

    const params =
        new URLSearchParams(window.location.search);

    const course =
        params.get("course") || "";

    const semester =
        params.get("semester") || "";



    /*
    ==========================================
    PAGE TITLE
    ==========================================
    */

    const pageTitle =
        document.getElementById("pageTitle");


    if (course && semester) {

        pageTitle.textContent =
            course +
            " — Semester " +
            semester +
            " — Select Subject";

    }



    /*
    ==========================================
    SUBJECT LINKS
    ==========================================
    */

    const subjectLinks =
        document.querySelectorAll(".subject-link");


    subjectLinks.forEach(function(card) {

        const subject =
            card.getAttribute("data-subject");


        /*
        Subject पर click करने के बाद
        years.html खुलेगा
        */

        card.href =
            "years.html?course=" +
            encodeURIComponent(course) +
            "&semester=" +
            encodeURIComponent(semester) +
            "&subject=" +
            encodeURIComponent(subject);

    });

</script>


</body>

</html>
