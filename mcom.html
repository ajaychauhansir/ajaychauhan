<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>M.Com Question Papers | Study Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .header {
            background: linear-gradient(135deg, #ef6c00, #ff9800);
            color: white;
            padding: 32px 15px;
            text-align: center;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 15px;
        }

        .back {
            display: inline-block;
            text-decoration: none;
            background: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .page-title h2 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #666;
        }

        .semester-box {
            background: white;
            border-radius: 16px;
            margin-bottom: 18px;
            overflow: hidden;
            box-shadow: 0 5px 18px rgba(0,0,0,0.09);
        }

        .semester-title {
            background: linear-gradient(135deg, #ef6c00, #ff9800);
            color: white;
            padding: 18px 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 18px;
        }

        .year-card {
            background: #fff8f0;
            border: 1px solid #ffcc80;
            border-radius: 10px;
            padding: 14px 8px;
            text-align: center;
            font-weight: bold;
            color: #ef6c00;
        }

        .year-card:hover {
            background: #fff0d9;
        }

        .footer {
            text-align: center;
            padding: 25px;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .year-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>📈 M.Com Question Papers</h1>
    <p>Semester-wise previous year question papers</p>
</header>

<main class="container">

    <a href="question-papers.html" class="back">← Back to Courses</a>

    <div class="page-title">
        <h2>M.Com — Select Semester</h2>
        <p>Select a semester to view year-wise question papers.</p>
    </div>

    <div id="semester-container"></div>

</main>

<footer class="footer">
    <p>© 2026 Study Portal | Ajay Chauhan</p>
</footer>

<script>
    const semesters = 4;

    const years = [
        "2012",
        "2016",
        "2017",
        "2018",
        "2019",
        "2020",
        "2021",
        "2022",
        "2023 NEP",
        "2024 NEP",
        "2025 NEP"
    ];

    const container = document.getElementById("semester-container");

    for (let i = 1; i <= semesters; i++) {

        const semesterBox = document.createElement("div");
        semesterBox.className = "semester-box";

        let yearHTML = "";

        years.forEach(year => {
            yearHTML += `<div class="year-card">${year}</div>`;
        });

        semesterBox.innerHTML = `
            <div class="semester-title">
                Semester ${i}
            </div>

            <div class="year-grid">
                ${yearHTML}
            </div>
        `;

        container.appendChild(semesterBox);
    }
</script>

</body>
</html>
