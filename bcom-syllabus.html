<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B.Com | Study Portal</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #1f2937;
}

/* HEADER */

header {
    background: linear-gradient(135deg, #172554, #3730a3);
    color: white;
    padding: 35px 20px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

header h1 {
    font-size: 36px;
    margin-bottom: 8px;
}

header p {
    font-size: 16px;
    color: #e0e7ff;
}

/* BACK BUTTON */

.back {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 20px;
    background: white;
    color: #3730a3;
    text-decoration: none;
    border-radius: 25px;
    font-weight: bold;
    font-size: 14px;
}

.back:hover {
    background: #e0e7ff;
}

/* CONTAINER */

.container {
    max-width: 1000px;
    margin: 45px auto;
    padding: 0 20px;
}

/* TITLE */

.section-title {
    text-align: center;
    margin-bottom: 30px;
}

.section-title h2 {
    font-size: 30px;
    color: #172554;
    margin-bottom: 8px;
}

.section-title p {
    color: #64748b;
}

/* SEMESTER GRID */

.semester-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

/* SEMESTER CARD */

.semester-card {
    background: white;
    padding: 30px 20px;
    border-radius: 18px;
    text-align: center;
    text-decoration: none;
    color: #172554;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    border: 1px solid #e5e7eb;
    transition: 0.3s;
}

.semester-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    background: #eef2ff;
}

.semester-card .icon {
    font-size: 42px;
    margin-bottom: 15px;
}

.semester-card h3 {
    font-size: 23px;
    margin-bottom: 8px;
}

.semester-card p {
    color: #64748b;
    font-size: 14px;
}

/* MOBILE */

@media (max-width: 650px) {

    header h1 {
        font-size: 30px;
    }

    .semester-grid {
        grid-template-columns: 1fr;
    }

    .section-title h2 {
        font-size: 26px;
    }
}

</style>

</head>

<body>

<!-- HEADER -->

<header>

    <h1>B.Com</h1>

    <p>Bachelor of Commerce | Study Portal</p>

    <a href="../index.html" class="back">
        ← Back to Home
    </a>

</header>


<!-- MAIN CONTENT -->

<div class="container">

    <div class="section-title">

        <h2>Select Semester</h2>

        <p>Choose your B.Com semester</p>

    </div>


    <div class="semester-grid">


        <!-- SEMESTER 1 -->

        <a href="Sem-1/index.html" class="semester-card">

            <div class="icon">📘</div>

            <h3>Semester 1</h3>

            <p>B.Com Semester 1</p>

        </a>


        <!-- SEMESTER 2 -->

        <a href="Sem-2/index.html" class="semester-card">

            <div class="icon">📗</div>

            <h3>Semester 2</h3>

            <p>B.Com Semester 2</p>

        </a>


        <!-- SEMESTER 3 -->

        <a href="Sem-3/index.html" class="semester-card">

            <div class="icon">📕</div>

            <h3>Semester 3</h3>

            <p>B.Com Semester 3</p>

        </a>


        <!-- SEMESTER 4 -->

        <a href="Sem-4/index.html" class="semester-card">

            <div class="icon">📙</div>

            <h3>Semester 4</h3>

            <p>B.Com Semester 4</p>

        </a>


        <!-- SEMESTER 5 -->

        <a href="Sem-5/index.html" class="semester-card">

            <div class="icon">📔</div>

            <h3>Semester 5</h3>

            <p>B.Com Semester 5</p>

        </a>


        <!-- SEMESTER 6 -->

        <a href="Sem-6/index.html" class="semester-card">

            <div class="icon">📓</div>

            <h3>Semester 6</h3>

            <p>B.Com Semester 6</p>

        </a>


    </div>

</div>

</body>

</html>
